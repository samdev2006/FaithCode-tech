 <svg 
      width={size} 
      height={size} 
      viewBox="0 0 100 100" 
      fill="none" 
      xmlns="http://www.w3.org/2000/svg"
      className="filter drop-shadow-[0_0_8px_rgba(212,113,178,0.6)]" 
    >
      <defs>
        <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#8294FF" />   {/* Bleu/Violet */}
          <stop offset="50%" stopColor="#D471B2" />  {/* Rose */}
          <stop offset="100%" stopColor="#FF8C52" /> {/* Orange */}
        </linearGradient>
      </defs>
      
      {/* L'Hexagone extérieur */}
      <path 
        d="M50 5L89 27.5V72.5L50 95L11 72.5V27.5L50 5Z" 
        stroke="url(#neonGradient)" 
        strokeWidth="6"
        strokeLinejoin="round"
      />
      
      {/* Le cercle/hexagone intérieur */}
      <path 
        d="M50 15L80 32.5V67.5L50 85L20 67.5V32.5L50 15Z" 
        fill="#1A1535" 
        stroke="url(#neonGradient)" 
        strokeWidth="2"
      />

      {/* La lettre F */}
      <text 
        x="50%" 
        y="52%" 
        textAnchor="middle" 
        dominantBaseline="middle" 
        fill="white" 
        fontSize="35" 
        fontWeight="900" 
        fontFamily="Arial, sans-serif"
      >
        F
      </text>
    </svg>